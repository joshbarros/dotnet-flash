name: dotnet-flash

services:
  db:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:5484:5432"
    environment:
      POSTGRES_DB: flash
      POSTGRES_USER: flash
      POSTGRES_PASSWORD: flash
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flash -d flash"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.8.1
    ports:
      - "127.0.0.1:9134:9134"
    environment:
      CLUSTER_ID: "ZvyM67H8cC46hUfCAiyElZ"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9134,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:9134
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xmx384m -Xms256m"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    volumes:
      - kafkadata:/var/lib/kafka/data
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "127.0.0.1:5714:5672"
      - "127.0.0.1:15714:15672"
    environment:
      RABBITMQ_DEFAULT_USER: platform
      RABBITMQ_DEFAULT_PASS: platform
      RABBITMQ_DEFAULT_VHOST: /
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    restart: unless-stopped

  api:
    build:
      context: .
      target: api
    ports:
      - "127.0.0.1:5224:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Demo defaults so `docker compose up` works. Copy .env.example to .env and change them for anything shared.
      Jwt__Key: ${JWT_KEY:-compose-demo-signing-key-change-before-sharing-0123456789}
      Identity__SeedAdmin__Email: ${ADMIN_EMAIL:-admin@flash.local}
      Identity__SeedAdmin__Password: ${ADMIN_PASSWORD:-FlashAdmin2026}
      ForwardedHeaders__Enabled: "true"
      Docs__Public: "true"
      # The browser specs sign in many times from one address; the code default is 20 a minute.
      RateLimit__AuthPerMinute: ${AUTH_RATE_LIMIT:-120}
      Logging__Json: "true"
      # Demo conveniences. Production: confirmation on, dev mailbox off, a real SMTP host (Mail__Host and friends).
      Jwt__RevocationCacheSeconds: "2"
      Auth__RequireConfirmedEmail: ${REQUIRE_CONFIRMED_EMAIL:-false}
      Auth__PublicUrl: http://127.0.0.1:8104
      Mail__DevMailbox: ${DEV_MAILBOX:-true}
      ConnectionStrings__Flash: "Host=db;Port=5432;Database=flash;Username=flash;Password=flash"
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__User: platform
      RabbitMq__Password: platform
      Kafka__BootstrapServers: kafka:9092
      Orders__FinalMarkDelayMs: 1500
      Deals__HoldSeconds: 12
      Deals__SweepIntervalMs: 500
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c \"exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /api/health HTTP/1.0\\r\\nHost: 127.0.0.1\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q 200\""]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    ports:
      - "127.0.0.1:8104:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
  kafkadata:
  rabbitdata:
